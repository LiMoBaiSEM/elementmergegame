    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#141b29');
    bg.addColorStop(0.55, '#0c111a');
    bg.addColorStop(1, '#070a0f');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    var g1 = ctx.createRadialGradient(320, 180, 10, 320, 180, 420);
    g1.addColorStop(0, 'rgba(255,150,70,.16)'); g1.addColorStop(1, 'rgba(255,150,70,0)');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
    var g2 = ctx.createRadialGradient(540, 520, 10, 540, 520, 380);
    g2.addColorStop(0, 'rgba(80,140,255,.13)'); g2.addColorStop(1, 'rgba(80,140,255,0)');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

    var strip = ['#63c23c', '#ff6b3d', '#c08a55', '#f5b832', '#4a9df0'];
    for (var i = 0; i < 5; i++) { ctx.fillStyle = strip[i]; ctx.fillRect(i * W / 5, 0, W / 5 + 1, 7); }

    ctx.textAlign = 'left';
    ctx.font = 'bold 44px Georgia, serif';
    var e = 'ELEMENT ';
    var m = 'MERGE';
    var ew = ctx.measureText(e).width;
    var mw = ctx.measureText(m).width;
    var sx = (W - ew - mw) / 2;
    ctx.fillStyle = '#f4f6fb'; ctx.fillText(e, sx, 92);
    ctx.fillStyle = '#f2b45c'; ctx.fillText(m, sx + ew, 92);
    ctx.textAlign = 'center';
    ctx.font = '18px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#8b96aa';
    ctx.fillText('FIVE ELEMENTS  ·  ONE SPIRIT', W / 2, 124);

    ctx.fillStyle = 'rgba(255,255,255,.04)';
    roundRect(ctx, 46, 158, W - 92, 236, 22); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.font = 'bold 18px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#8e99ad';
    var dailyDiff = S.dailyDiff || 'standard';
    var dailyD = DAILY_DIFFS[dailyDiff] || DAILY_DIFFS.standard;
    var kicker = kind === 'daily'
      ? 'DAILY · ' + dailyD.label.toUpperCase() + ' · ' + dailyLabel().toUpperCase()
      : 'LEVEL ' + (S.levelIdx + 1) + ' · ' + diffFor(S.levelIdx).toUpperCase();
    ctx.fillText(kicker, W / 2, 196);

    if (kind === 'daily') {
      ctx.font = 'bold 34px Georgia, serif';
      ctx.fillStyle = '#f2b45c';
      ctx.fillText((S.daily ? S.daily.streak : effectiveStreak()) + ' DAY STREAK', W / 2, 246);
    } else {
      var stars = S.stars || 0;
      for (var s = 0; s < 3; s++) {
        starPath(ctx, W / 2 + (s - 1) * 62, 244, 26, 11, 5);
        if (s < stars) { ctx.fillStyle = '#ffd166'; ctx.fill(); }
        else { ctx.strokeStyle = '#3b4352'; ctx.lineWidth = 2; ctx.stroke(); }
      }
    }

    ctx.font = 'bold 64px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#ffffff';
    var scoreTxt = formatNum(S.score);
    ctx.fillText(scoreTxt, W / 2, 336);
    ctx.font = 'bold 15px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#8e99ad';
    ctx.fillText('POINTS', W / 2, 362);

    ctx.font = '16px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#9aa5b8';
    var stats = kind === 'daily'
      ? ['Spirits ' + S.spirits, 'Moves ' + S.movesMax, 'Weekly ' + (S.daily && S.daily.rank ? '#' + S.daily.rank : '—')]
      : ['Moves left ' + S.steps, 'Time ' + fmtTime(S.timer.elapsed), 'Best merge ' + (S.maxMergeLevel >= 6 ? 'Spirit' : 'Lv' + S.maxMergeLevel)];
    ctx.fillText(stats.join('   ·   '), W / 2, 400);

    var keys = ['fire', 'water', 'wood', 'metal', 'earth'];
    var size = 54, gap = 20;
    var total = keys.length * size + (keys.length - 1) * gap;
    var x0 = (W - total) / 2;
    keys.forEach(function (k, idx) {
      var cx = x0 + idx * (size + gap) + size / 2;
      ctx.save();
      ctx.shadowColor = HEX[k]; ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(255,255,255,.035)';
      ctx.beginPath(); ctx.arc(cx, 470, size / 2 + 12, 0, Math.PI * 2); ctx.fill();
      ctx.translate(cx - size / 2, 470 - size / 2);
      ctx.scale(size / 32, size / 32);
      ctx.fillStyle = ICON_FILL[k];
      ctx.fill(new Path2D(ICON_PATH[k]));
      ctx.restore();
    });

    ctx.font = 'italic 20px Georgia, serif';
    ctx.fillStyle = '#aab4c6';
    ctx.fillText('“Merge what feeds. Clear what blocks.”', W / 2, 548);

    var qrSize = 132;
    var qrX = (W - qrSize) / 2, qrY = 590;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, qrX - 9, qrY - 9, qrSize + 18, qrSize + 18, 10); ctx.fill();
    try {
      var qr = qrcode(0, 'M');
      qr.addData('https://elementmergegame.com');
      qr.make();
      var count = qr.getModuleCount();
      var cell = qrSize / count;
      ctx.fillStyle = '#0b0e14';
      for (var rr = 0; rr < count; rr++) for (var cc = 0; cc < count; cc++) {
        if (qr.isDark(rr, cc)) ctx.fillRect(qrX + cc * cell, qrY + rr * cell, cell, cell);
      }
    } catch (e) {}

    ctx.font = 'bold 26px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#5dcaa5';
    ctx.fillText('elementmergegame.com', W / 2, 770);
    ctx.font = '14px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#6e798d';
    ctx.fillText('Scan to play  ·  Free in your browser', W / 2, 798);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(110, 826, W - 220, 1);
    ctx.font = '12px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = '#5d6678';
    ctx.fillText('AI-CRAFTED FIVE ELEMENTS PUZZLE  ·  AIGAMESLAB.ORG', W / 2, 856);
    return c.toDataURL('image/png');
  }

  /* ------------------------------------------------------------------ */
  /* Unlocks / daily dot                                                 */
  /* ------------------------------------------------------------------ */
  function maybeAnnounceUnlock(idx) {
    if (S.sim) return;
    var lv = idx + 1;
    for (var i = 0; i < ADVANCED.length; i++) {
      var t = ADVANCED[i];
      if (UNLOCK_AT[t] === lv && save.seenUnlocks.indexOf(t) < 0) {
        var msg = t === 'wind' ? 'New: Wind — tap it twice to swirl its neighbors'
          : t === 'thunder' ? 'New: Thunder — tap it twice to clear its row and column'
          : t === 'ice' ? 'New: Ice — tap it twice for +3 moves'
          : t === 'light' ? 'New: Light — a wildcard that pairs with any base element'
          : 'New: Dark — clears any adjacent element';
        setTimeout(function () { toast(msg, 3600); }, 500);
        save.seenUnlocks.push(t);
        persistSave();
      }
    }
  }
  function updateDailyDot() {
    if (!dailyDot) return;
    dailyDot.classList.toggle('on', !playedDailyToday());
  }

  /* ------------------------------------------------------------------ */
  /* Wiring                                                              */
  /* ------------------------------------------------------------------ */
  boardEl.addEventListener('click', onBoardClick);
  boardEl.addEventListener('keydown', onBoardKey);
  boardEl.addEventListener('focusin', function (e) {
    var el = e.target.closest ? e.target.closest('.cell') : null;
    if (el) S.focus = [parseInt(el.dataset.r, 10), parseInt(el.dataset.c, 10)];
  });

  hintBtn.addEventListener('click', function () { if (!S.finished && !S.busy) buildHint(); });
  if (swapBtn) swapBtn.addEventListener('click', function () {
    if (S.finished || S.busy) return;
    if (S.swaps <= 0 && !S.swapMode) { setStatus('No swaps left this level', 1400); return; }
    S.swapMode = !S.swapMode;
    S.swapFirst = null;
    S.selected = null;
    S.hint = null;
    S.msg = null;
    playUi();
    render();
  });
  undoBtn.addEventListener('click', undoMove);
  restartBtn.addEventListener('click', function () {
    if (S.steps < S.movesMax || S.score > 0) openRestart();
    else restartCurrent();
  });
  helpBtn.addEventListener('click', function () { openHowTo(false); });
  levelsBtn.addEventListener('click', openLevels);
  dailyBtn.addEventListener('click', function () { openDaily(S.dailyTab); });

  function updateMuteIcon() {
    muteBtn.innerHTML = muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.4L12 18V6L7.4 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.4L12 18V6L7.4 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.6a7.4 7.4 0 0 1 0 10.8"/></svg>';
    muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
    muteBtn.title = muted ? 'Sound off' : 'Sound on';
  }
  function setMuted(v) {
    muted = !!v;
    settings.muted = muted;
    persistSettings();
    updateMuteIcon();
    if (muted) stopBgm();
    else { ensureAudio(); startBgm(); }
  }
  muteBtn.addEventListener('click', function () { setMuted(!muted); playUi(); });

  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function toggleFullscreen() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (!fullscreenElement() && req) {
      try {
        var p = req.call(el, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(function () { toast('Fullscreen was blocked by the browser.', 2600); });
      } catch (e) { toast('Fullscreen is not available in this browser.', 2600); }
    } else if (fullscreenElement() && exit) {
      try { exit.call(document); } catch (e) {}
    } else {
      toast('Use your browser menu for fullscreen, or open the game in a new tab.', 3000);
    }
  }
  fsBtn.addEventListener('click', function () { toggleFullscreen(); playUi(); });
  document.addEventListener('fullscreenchange', function () {
    fsBtn.setAttribute('aria-label', fullscreenElement() ? 'Exit fullscreen' : 'Fullscreen');
    fsBtn.title = fullscreenElement() ? 'Exit fullscreen' : 'Fullscreen';
  });
  document.addEventListener('webkitfullscreenchange', function () {
    fsBtn.setAttribute('aria-label', fullscreenElement() ? 'Exit fullscreen' : 'Fullscreen');
    fsBtn.title = fullscreenElement() ? 'Exit fullscreen' : 'Fullscreen';
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      pauseTimer();
      stopBgm();
    } else if (!isModalOpen() && !S.finished) {
      resumeTimer();
      if (!muted) startBgm();
    }
  });

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */
  function boot() {
    updateMuteIcon();
    var startIdx = Math.min(save.unlocked, LEVELS.length) - 1;
    var qs = location.search;
    var debug = /[?&]debug=1/.test(qs);
    var noIntro = /[?&]nointro=1/.test(qs);
    var dailyMatch = /[?&]daily=(casual|standard|expert)/.exec(qs);
    if (dailyMatch) {
      pendingDaily = dailyMatch[1];
      S.dailyTab = pendingDaily;
    }
    startLevel(startIdx);
    if (!save.seenHelp && !noIntro) {
      setTimeout(function () { openHowTo(true); }, 420);
    } else if (pendingDaily) {
      var d = pendingDaily;
      pendingDaily = null;
      setTimeout(function () { openDaily(d); }, 280);
    } else if (debug) {
      console.log('Element Merge debug ready', VERSION);
    }
  }

  /* ------------------------------------------------------------------ */
  /* Debug / balance hooks                                               */
  /* ------------------------------------------------------------------ */
  if (/[?&]debug=1/.test(location.search)) {
    window.__EM = {
      version: VERSION,
      levels: LEVELS,
      state: function () {
        return {
          mode: S.mode, levelIdx: S.levelIdx, goal: S.goal, board: S.board,
          score: S.score, steps: S.steps, movesMax: S.movesMax, progress: S.progress,
          spirits: S.spirits, combo: S.combo, won: S.won, finished: S.finished,
          maxMergeLevel: S.maxMergeLevel, seed: S.seed, rngState: S.rngState,
          law: S.law, swaps: S.swaps, swapMode: S.swapMode, movesMade: S.movesMade,
          dailyDiff: S.dailyDiff, voids: voidCount(), playerId: PLAYER_ID
        };
      },
      tap: handleTap,
      put: function (r, c, type, level) {
        if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
        S.board[r][c] = { type: type, level: level || 1 };
        render();
      },
      startLevel: function (i) { startLevel(i, {}); },
      startDaily: function (diff) { startDaily({ diff: diff || S.dailyDiff || 'standard' }); },
      endDailyNow: function (diff, score) {
        startDaily({ diff: diff || S.dailyDiff || 'standard' });
        S.score = score || 0;
        S.steps = 0;
        finishDaily();
      },
      weekly: function (diff) { return weeklyEntries(diff || 'standard'); },
      simulateDaily: function (diff, attempts) {
        diff = diff || 'standard';
        attempts = attempts || 10;
        var out = [];
        for (var i = 0; i < attempts; i++) {
          startDaily({ diff: diff, sim: true, seed: randSeed() });
          var guard = 0;
          while (!S.finished && guard++ < 400) {
            var mv = findMove();
            if (mv) {
              if (mv.type === 'merge') doMerge(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
              else doKill(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
            } else {
              var pw = findPowerCell();
              if (pw) activatePower(pw[0], pw[1]);
              else {
                shuffleCells();
                if (!hasAnyMove()) break;
              }
            }
          }
          out.push(S.score);
        }
        S.sim = false;
        startLevel(Math.min(save.unlocked, LEVELS.length) - 1);
        var avg = out.reduce(function (a, b) { return a + b; }, 0) / out.length;
        return { diff: diff, scores: out, avg: Math.round(avg), min: Math.min.apply(null, out), max: Math.max.apply(null, out) };
      },
      findMove: findMove,
      hint: buildHint,
      undo: undoMove,
      shuffle: function () { shuffleCells(); render(); },
      hasAnyMove: hasAnyMove,
      simulateLevel: function (idx, attempts) {
        attempts = attempts || 40;
        var out = [];
        var oldMode = S.mode, oldIdx = S.levelIdx;
        for (var it = 0; it < attempts; it++) {
          startLevel(idx, { sim: true, seed: randSeed() });
          var guard = 0;
          while (!S.finished && guard++ < 3000) {
            var mv = findMove();
            if (mv) {
              if (mv.type === 'merge') doMerge(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
              else doKill(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
            } else {
              var pw = findPowerCell();
              if (pw) activatePower(pw[0], pw[1]);
              else {
                shuffleCells();
                if (!hasAnyMove()) break;
              }
            }
          }
          out.push({ won: S.won, used: S.movesMax - S.steps, score: S.score, spirits: S.spirits, progress: S.progress, max: S.maxMergeLevel });
        }
        S.sim = false;
        var wins = out.filter(function (o) { return o.won; }).length;
        var used = out.map(function (o) { return o.used; });
        var avg = used.reduce(function (a, b) { return a + b; }, 0) / used.length;
        var res = {
          level: idx + 1, goal: LEVELS[idx].lv + 'x' + LEVELS[idx].n, moves: LEVELS[idx].moves,
          attempts: attempts, winRate: +(wins / attempts).toFixed(2),
          avgUsed: +avg.toFixed(1), minUsed: Math.min.apply(null, used), maxUsed: Math.max.apply(null, used),
          avgSpirits: +(out.reduce(function (a, o) { return a + o.spirits; }, 0) / attempts).toFixed(1),
          avgMax: +(out.reduce(function (a, o) { return a + o.max; }, 0) / attempts).toFixed(1),
          avgProgress: +(out.reduce(function (a, o) { return a + o.progress; }, 0) / attempts).toFixed(1)
        };
        startLevel(Math.min(save.unlocked, LEVELS.length) - 1);
        return res;
      },
      simulateAll: function (attempts) {
        var res = [];
        for (var i = 0; i < LEVELS.length; i++) res.push(window.__EM.simulateLevel(i, attempts || 20));
        return res;
      },
      simTrace: function (idx, seed, moves) {
        LEVELS[idx].moves = moves || 300;
        startLevel(idx, { sim: true, seed: seed || 12345 });
        var trace = [];
        var guard = 0;
        while (!S.finished && guard++ < (moves || 300) + 200) {
          if (guard % 25 === 0) {
            trace.push({ guard: guard, steps: S.steps, progress: S.progress, max: S.maxMergeLevel, board: JSON.parse(JSON.stringify(S.board)) });
          }
          var mv = findMove();
          if (mv) {
            if (mv.type === 'merge') doMerge(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
            else doKill(mv.a[0], mv.a[1], mv.b[0], mv.b[1]);
          } else {
            var pw = findPowerCell();
            if (pw) activatePower(pw[0], pw[1]);
            else {
              shuffleCells();
              if (!hasAnyMove()) break;
            }
          }
        }
        var res = { won: S.won, steps: S.steps, progress: S.progress, max: S.maxMergeLevel, guard: guard, trace: trace, board: JSON.parse(JSON.stringify(S.board)) };
        S.sim = false;
        startLevel(Math.min(save.unlocked, LEVELS.length) - 1);
        return res;
      }
    };
  }

  boot();
})();

</script>
